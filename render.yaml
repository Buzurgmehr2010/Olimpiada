services:
  - type: web
    name: olympiada
    runtime: php
    plan: free
    buildCommand: composer install --no-dev --no-interaction --prefer-dist
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    preDeployCommand: touch database/database.sqlite && php artisan migrate --force && php artisan db:seed --force
    envVars:
      - key: APP_NAME
        value: Olympiada
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: database/database.sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stack
